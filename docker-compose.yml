services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      TRIALGUARD_DATA_DIR: /data
      TRIALGUARD_LOG_LEVEL: ${TRIALGUARD_LOG_LEVEL:-INFO}
      TRIALGUARD_OLLAMA_MODEL: ${TRIALGUARD_OLLAMA_MODEL:-llama3.2:3b}
      TRIALGUARD_OLLAMA_BASE_URL: ${TRIALGUARD_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - trialguard-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: .
    command: >-
      python -m streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    environment:
      TRIALGUARD_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trialguard-data:
