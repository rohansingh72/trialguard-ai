services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TRIALGUARD_POSTGRES_DB:-trialguard}
      POSTGRES_USER: ${TRIALGUARD_POSTGRES_USER:-trialguard}
      POSTGRES_PASSWORD: ${TRIALGUARD_POSTGRES_PASSWORD:-trialguard}
    volumes:
      - trialguard-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TRIALGUARD_POSTGRES_USER:-trialguard} -d ${TRIALGUARD_POSTGRES_DB:-trialguard}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    environment:
      TRIALGUARD_DATA_DIR: /data
      TRIALGUARD_DATABASE_URL: >-
        postgresql+psycopg://${TRIALGUARD_POSTGRES_USER:-trialguard}:${TRIALGUARD_POSTGRES_PASSWORD:-trialguard}@postgres:5432/${TRIALGUARD_POSTGRES_DB:-trialguard}
      TRIALGUARD_LOG_LEVEL: ${TRIALGUARD_LOG_LEVEL:-INFO}
      TRIALGUARD_OLLAMA_MODEL: ${TRIALGUARD_OLLAMA_MODEL:-llama3.2:3b}
      TRIALGUARD_OLLAMA_BASE_URL: ${TRIALGUARD_DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - trialguard-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build: .
    command: >-
      python -m streamlit run dashboard/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    environment:
      TRIALGUARD_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  trialguard-data:
  trialguard-postgres:
